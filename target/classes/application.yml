spring:
  application:
    name: finpilot-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/finpilot_dev
    username: postgres
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # validate, not update/create — Flyway migrations are the single
      # source of truth for schema. Hibernate should only ever confirm
      # entities match what Flyway already created, never auto-generate DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

finpilot:
  ai-service:
    base-url: http://127.0.0.1:8001
    api-key: change-me-in-env
  jwt:
    secret: this-is-a-dev-only-secret-change-it-before-production-32chars+
    expiration-minutes: 60

logging:
  level:
    org.hibernate.SQL: debug

